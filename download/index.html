<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Install SnowScope (test build)</title>
<link rel="icon" href="../static/icon.svg"><link rel="stylesheet" href="../static/page.css"></head>
<body><main class="doc" style="max-width:760px;margin:0 auto;padding:16px">
<h1>Install SnowScope (test build)</h1>
<p id="s">Finding the current download…</p>
<p>If Android says <b>App not installed</b>, uninstall the Play test version first (different signature),
then open this page again. Allow “install unknown apps” for your browser when asked.</p>
<script>
fetch('../config.json', {cache: 'no-store'}).then(r => r.json()).then(c => {
  const u = c.api.replace(/\/$/, '') + '/download/snowscope.apk';
  document.getElementById('s').innerHTML = '<a href="' + u + '"><b>Download SnowScope APK</b></a>';
  location.href = u;
}).catch(() => { document.getElementById('s').textContent = 'Server offline - try again later.'; });
</script>
<p><a href="../">← Snow map</a></p></main></body></html>
