<meta name="description" content="Snow depth today at 0 ski resorts in the Alps, Pyrenees, North America and the Atlas, sorted by snow.">

</div></header>
<main class="wrap">
  <div class="crumbs"><a href="../">Snow map</a> › Resorts</div>
  <h1 style="margin-top:8px">All ski resorts</h1>
  <p class="lede">0 resorts, deepest snow first. Tap a resort for its snow, the next days and hotels.</p>
  <div class="pills" id="tabs" role="group" aria-label="Region" style="margin:14px -16px 6px"></div>
  <input class="filter" id="q" type="search" placeholder="Filter resorts" aria-label="Filter resorts">

</main>
<script src="../i18n.js"></script>
<script src="../core.js"></script>
<script>
SS.start();
(() => {
  const q = document.getElementById("q"), norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const secs = [...document.querySelectorAll("#list section")], tabs = document.getElementById("tabs");
  let cur = null; try { cur = localStorage.getItem("ss_region"); cur = cur && JSON.parse(cur); } catch { /* private mode */ }
  if (!secs.some((s) => s.dataset.region === cur)) cur = secs[0] && secs[0].dataset.region;
  const pre = new URLSearchParams(location.search).get("q"); if (pre) q.value = pre;
  const run = () => {
    const v = norm(q.value.trim());
    tabs.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === cur));
    secs.forEach((s) => {
      s.hidden = !v && s.dataset.region !== cur;
      const more = s.querySelector(".more");
      let shown = 0;
      s.querySelectorAll("tbody tr").forEach((tr, i) => { const hit = v ? norm(tr.textContent).includes(v) : (s.dataset.all || i < 50); tr.hidden = !hit; if (hit) shown++; });
      if (more) more.hidden = !!v || !!s.dataset.all;
      if (v && !shown) s.hidden = true;
    });
  };
  if (SS.U && SS.U.us()) {          // US units: the static table is written in cm / m; rewrite the numbers in place
    const U = SS.U;
    document.querySelectorAll("[data-unit-h]").forEach((x) => { x.textContent = "Snow, in"; });
    document.querySelectorAll("td[data-cm]").forEach((td) => { const v = +td.dataset.cm; if (!v) return; const b = td.querySelector("b"); if (b) b.textContent = U.dep(v); else td.textContent = "+" + U.dep(v); });
    document.querySelectorAll("td[data-m]").forEach((td) => { const v = +td.dataset.m; if (v) td.textContent = U.elev(v); });
  }
  tabs.onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { cur = b.dataset.tab; q.value = ""; run(); } };
  document.getElementById("list").onclick = (e) => { const m = e.target.closest(".more"); if (m) { m.closest("section").dataset.all = "1"; run(); } };
  q.addEventListener("input", run); run();
})();
</script>
</body>
</html>
