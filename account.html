<!doctype html>
<html lang="en" data-root="" data-noads="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your account · SnowScope</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..750&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=block">
<link rel="stylesheet" href="site.css">
<style>.acc{max-width:620px;margin:0 auto}.acc .card{margin-top:12px}.acc h1{margin-top:22px}.kv{display:flex;justify-content:space-between;gap:12px;align-items:center}
.acc .card h2{font-size:17px;margin:0 0 6px;font-weight:650}.acc .card p{margin:4px 0;color:var(--ink2);font-size:14px}.ok{color:var(--good)}.warn{color:var(--fair)}
.inline{display:flex;gap:8px;margin-top:8px}.inline input{flex:1;height:42px;border-radius:12px;border:1px solid var(--outline);background:var(--surface2);color:var(--ink);padding:0 12px;font:inherit}</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><img src="logo.svg" alt="" width="30" height="30">SnowScope</a>
  <button class="btn icon langbtn" data-lang aria-label="Language"><span class="ms">language</span></button>
  <div class="acct" id="acct" style="margin-left:auto"></div>
</div></header>
<main class="wrap"><div class="acc" id="acc"><h1>Your account</h1><p class="none">Loading…</p></div>
  <footer class="foot"><nav><a href="./">Snow today</a><a href="privacy/">Privacy</a><a href="terms/">Terms</a><a href="delete/">Delete your data</a><a href="refund.html">Refunds</a></nav><p>Help: <a href="mailto:support@snowscope.app">support@snowscope.app</a> · Business and press: <a href="mailto:contact@snowscope.app">contact@snowscope.app</a> · Privacy requests: <a href="mailto:privacy@snowscope.app">privacy@snowscope.app</a></p>© 2026 SnowScope · Atlas Labs</footer>
</main>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script>
(async () => {
  const { esc, Auth } = SS, box = document.getElementById("acc");
  const S = await SS.start();
  let note = location.hash === "#verify" ? "We sent you an e-mail. Click the link in it to confirm your address." : "";
  const date = (s) => s ? new Date(s).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
  function draw() {
    if (!Auth.enabled()) { box.innerHTML = '<h1>Your account</h1><div class="card"><p>Signing in on the website is coming soon. Your account and Pro are in the SnowScope app.</p><a class="btn ski" style="margin-top:8px" href="' + esc(SS.appUrl()) + '">Get the app</a></div>'; return; }
    const u = S.user;
    if (!u) {
      box.innerHTML = '<h1>Your account</h1><div class="card"><p>One account for the SnowScope app and this website: your Pro, favourites and alerts follow you.</p>' +
        '<div class="inline"><button class="btn ink" data-in>Sign in</button><button class="btn ghost" data-up>Create an account</button></div></div>';
      return;
    }
    const pw = (u.providerData || []).some((p) => p.providerId === "password");
    const me = S.me || {}, acc = me.account || {}, ent = me.entitlement || {};
    let pro = "";
    if (S.state === "checking") pro = "<p>Checking…</p>";
    else if (S.state === "api_down") pro = '<p class="msg">Pro data is updating, try again in a minute.</p><button class="btn tonal" data-retry>Try again</button>';
    else if (S.state === "no_account") pro = "<p>This sign-in isn't connected to SnowScope yet. Open the app, sign in with the same account once, then come back.</p>" +
      '<a class="btn ski" style="margin-top:8px" href="' + esc(SS.appUrl()) + '">Open the app</a>' +
      (window.SSPay && SSPay.enabled() ? ' <button class="btn ghost" style="margin-top:8px" data-buy-pro>Get Pro</button>' : "");
    else if (S.pro) pro = '<p class="kv"><span><span class="pro"><span class="ms f">workspace_premium</span>PRO</span> You have SnowScope Pro.</span></p>' +
      (ent.lifetime ? "<p>Yours forever.</p>" : ent.expiry_utc ? "<p>" + (ent.auto_renewing ? "Renews on " : "Until ") + date(ent.expiry_utc) + ".</p>" : acc.comp_until ? "<p>Until " + date(acc.comp_until) + ".</p>" : "") +
      (ent.payment_issue ? '<p class="warn">There is a problem with your payment. ' + (ent.source === "paddle" ? "Update your card with Manage or cancel below." : "Fix it in Google Play → Subscriptions.") + "</p>" : "") +
      (ent.source === "paddle" && !ent.lifetime ? '<button class="btn tonal" style="margin-top:6px" data-manage-pro>Manage or cancel</button>' : "") +
      "<p>No ads on the website, and every map layer and day.</p>";
    else pro = "<p>Free plan" + (S.noAds ? " without ads" : "") + '.</p>' + (window.SSPay && SSPay.enabled() ? '<button class="btn ski" style="margin-top:8px" data-buy-pro>Get Pro</button> <a class="linkbtn" href="refund.html">Refunds and cancelling</a>'
      : '<a class="btn ski" style="margin-top:8px" href="' + esc(SS.appUrl()) + '">Get Pro in the Android app</a>');
    box.innerHTML = '<h1>Your account</h1>' + (note ? '<p class="msg ok">' + esc(note) + "</p>" : "") +
      '<div class="card"><h2>' + esc(u.displayName || u.email || "Signed in") + "</h2><p>" + esc(u.email || u.phoneNumber || "") + "</p>" +
      (u.email ? (u.emailVerified ? '<p class="ok">✓ E-mail confirmed</p>' : '<p class="warn">E-mail not confirmed yet.</p><div class="inline"><button class="btn tonal" data-verify>Send the link again</button><button class="btn ghost" data-reload>I clicked the link</button></div>') : "") + "</div>" +
      '<div class="card"><h2>SnowScope Pro</h2>' + pro + "</div>" +
      '<div class="card"><h2>Your name</h2><p>Shown on your account. Your public profile is set up in the app (You → Public profile).</p><div class="inline"><input id="nm" maxlength="60" value="' + esc(u.displayName || "") + '" aria-label="Your name"><button class="btn tonal" data-name>Save</button></div></div>' +
      (pw ? '<div class="card"><h2>Password</h2><p>We will e-mail you a link to choose a new password.</p><button class="btn tonal" data-reset style="margin-top:6px">Send me the link</button></div>' : "") +
      '<div class="card"><div class="inline" style="margin:0"><button class="btn ghost" data-out>Sign out</button></div></div>' +
      '<div class="card"><h2>Delete your account</h2><p>Deleting erases your account, favourites, alerts, snow reports and public profile, in the app and here. Do it in the app (You → Delete account) or follow the steps on the delete page.</p><a class="btn ghost" style="margin-top:6px;color:var(--danger)" href="delete/">How to delete my account</a></div>';
  }
  box.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    try {
      if (t.matches("[data-in]")) SS.signInModal("in");
      else if (t.matches("[data-up]")) SS.signInModal("up");
      else if (t.matches("[data-verify]")) { await Auth.verify(); note = "Link sent to " + S.user.email + "."; draw(); }
      else if (t.matches("[data-reload]")) { await Auth.reload(); note = S.user.emailVerified ? "Thanks, your e-mail is confirmed." : "Not confirmed yet. Open the link in the e-mail first."; draw(); }
      else if (t.matches("[data-retry]")) { await Auth.reload(); }
      else if (t.matches("[data-name]")) { await Auth.rename(document.getElementById("nm").value.trim()); note = "Saved."; draw(); }
      else if (t.matches("[data-reset]")) { await Auth.reset(S.user.email); note = "Link sent to " + S.user.email + "."; draw(); }
      else if (t.matches("[data-out]")) { await Auth.signOut(); note = ""; }
    } catch (er) { note = Auth.errText(er) || ""; draw(); }
  });
  SS.onChange(draw);
  draw();
})();
</script>
</body>
</html>
